services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digger}
      POSTGRES_USER: ${POSTGRES_USER:-digger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy or .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-digger}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy or .env}@db:5432/${POSTGRES_DB:-digger}
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  postgres_data:
